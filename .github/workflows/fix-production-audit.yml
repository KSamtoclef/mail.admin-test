name: One-time production dependency repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-production-audit.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply non-breaking production audit fixes
        run: npm audit fix --package-lock-only --omit=dev

      - name: Confirm no high-severity production advisories remain
        run: npm audit --omit=dev --audit-level=high

      - name: Remove one-time workflow and commit lockfile
        run: |
          rm .github/workflows/fix-production-audit.yml
          git config user.name "Mail Admin Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json .github/workflows/fix-production-audit.yml
          git commit -m "Fix high-severity production dependency advisory"
          git push
