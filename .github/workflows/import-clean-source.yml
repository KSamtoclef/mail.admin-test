name: Import cleaned Mail Admin source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-clean-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the supplied BLOP archive
        env:
          SOURCE_PAGE: https://www.mediafire.com/file/4vu11prh973bkz3/BLOP.zip/file
          EXPECTED_SHA256: 284592558ad17f953a0c7d6af1bcf1921cffcd20c20ecc689aea5a754519f332
        run: |
          python - <<'PY'
          import hashlib, html, os, re, urllib.request
          page = os.environ['SOURCE_PAGE']
          req = urllib.request.Request(page, headers={'User-Agent':'Mozilla/5.0'})
          text = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
          matches = [
              r'<a[^>]+id="downloadButton"[^>]+href="([^"]+)"',
              r'<a[^>]+href="([^"]+)"[^>]+id="downloadButton"',
          ]
          url = None
          for pattern in matches:
              m = re.search(pattern, text, re.I)
              if m:
                  url = html.unescape(m.group(1)); break
          if not url or not url.startswith('https://'):
              raise SystemExit('Could not resolve the MediaFire download URL.')
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Referer':page})
          data = urllib.request.urlopen(req, timeout=60).read()
          digest = hashlib.sha256(data).hexdigest()
          if digest != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'Archive checksum mismatch: {digest}')
          open('/tmp/BLOP.zip','wb').write(data)
          print('Verified source archive:', digest)
          PY
          unzip -t /tmp/BLOP.zip

      - name: Extract source without credentials or generated files
        run: |
          rm -rf /tmp/mail-admin-import
          mkdir -p /tmp/mail-admin-import
          unzip -oq /tmp/BLOP.zip -d /tmp/mail-admin-import
          shopt -s dotglob
          cp -a /tmp/mail-admin-import/project/* .
          rm -f .env
          rm -rf .bolt cloudflare-worker node_modules dist .bootstrap
          rm -f .github/workflows/import-clean-source.yml

      - name: Refuse secret files
        run: |
          test ! -f .env
          ! find . -maxdepth 3 -type f -name '.env*' ! -name '.env.example' | grep -q .

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import supplied Mail Admin rebuild"
          git push
