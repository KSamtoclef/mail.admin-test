name: Import Mail Admin rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-clean-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download supplied rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap/download
          python - <<'PY'
          import html
          import re
          import urllib.request

          page_url = 'https://www.mediafire.com/file/4vu11prh973bkz3/BLOP.zip/file'
          request = urllib.request.Request(page_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode('utf-8', 'ignore')

          patterns = [
              r'id="downloadButton"[^>]*href="([^"]+)"',
              r'href="(https://download[^\"]+)"[^>]*id="downloadButton"',
          ]
          download_url = None
          for pattern in patterns:
              match = re.search(pattern, page, flags=re.I)
              if match:
                  download_url = html.unescape(match.group(1))
                  break

          if not download_url:
              raise SystemExit('Could not resolve MediaFire download URL')

          download_request = urllib.request.Request(download_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(download_request, timeout=60) as response, open('.bootstrap/download/BLOP.zip', 'wb') as output:
              output.write(response.read())
          PY
          unzip -t .bootstrap/download/BLOP.zip

      - name: Extract project at repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap/extracted
          mkdir -p .bootstrap/extracted
          unzip -oq .bootstrap/download/BLOP.zip -d .bootstrap/extracted
          test -d .bootstrap/extracted/project
          cp -a .bootstrap/extracted/project/. .

          # Never publish runtime credentials into this public repository.
          rm -f .env

          # Remove one-time bootstrap assets after import.
          rm -rf .bootstrap
          rm -f .github/workflows/import-clean-source.yml

      - name: Verify secrets are not being committed
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          ! git status --porcelain | grep -E '(^|[[:space:]])\.env($|\.)'

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import rebuilt Mail Admin source"
          git push
